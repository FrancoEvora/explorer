name: Temporary ProPainter bundle

on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-propainter.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download source and pretrained models
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 5 --retry-delay 2 -o bundle/ProPainter.pth https://github.com/sczhou/ProPainter/releases/download/v0.1.0/ProPainter.pth
          curl -L --fail --retry 5 --retry-delay 2 -o bundle/raft-things.pth https://github.com/sczhou/ProPainter/releases/download/v0.1.0/raft-things.pth
          curl -L --fail --retry 5 --retry-delay 2 -o bundle/recurrent_flow_completion.pth https://github.com/sczhou/ProPainter/releases/download/v0.1.0/recurrent_flow_completion.pth
          curl -L --fail --retry 5 --retry-delay 2 -o bundle/ProPainter-main.zip https://github.com/sczhou/ProPainter/archive/refs/heads/main.zip
          sha256sum bundle/* > bundle/SHA256SUMS.txt
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: propainter-bundle
          path: bundle/*
          retention-days: 1
          compression-level: 0
