      <button class="hotspot" data-id="B" style="left:38%;top:51%">B</button>
      <button class="hotspot" data-id="D" style="left:45%;top:51%">D</button>
      <button class="hotspot" data-id="E" style="left:51%;top:51%">E</button>
      <button class="hotspot" data-id="C" style="left:44%;top:70%">C</button>
      <button class="hotspot amenity" data-id="lago" style="left:19%;top:48%">≋<span class="pulse"></span></button>

      <button class="hotspot amenity" data-id="hipica" style="left:50%;top:78%">♞<span class="pulse"></span></button>
      <button class="hotspot amenity" data-id="portaria" style="left:89%;top:55%">↗<span class="pulse"></span></button>
      <button class="hotspot amenity" data-id="parque" style="left:76%;top:30%">♧<span class="pulse"></span></button>
      <div class="mapshade"></div>
    </div>
  </main>
  <div class="hud"><button id="zoomIn" aria-label="Aproximar">+</button><button id="zoomOut" aria-label="Afastar">−</button><button id="reset" aria-label="Centralizar">⌂</button><button id="full" aria-label="Tela cheia">⛶</button></div>
  <div class="compass"><div class="needle"></div></div>
  <div class="status"><b>Exploração ativa</b> · arraste, dê zoom e toque nos pontos</div>
  <section class="scenes" id="scenes" aria-label="Cenas"></section>
  <aside class="drawer" id="drawer" aria-live="polite"><button class="close" id="closeDrawer">×</button><div class="eyebrow" id="drawerEyebrow">Solaris</div><h2 id="drawerTitle">Explore o Solaris</h2><p id="drawerText">Selecione uma quadra ou um ponto de interesse para navegar pelo masterplan.</p><div class="facts" id="drawerFacts"></div><button class="cta" id="drawerCta">Tenho interesse</button></aside>
  <div class="toast" id="toast"></div>

  <nav class="mobilebar"><button data-mobile="aerea"><b>◉</b>Mapa</button><button data-mobile="3d"><b>♙</b>3D</button><button data-mobile="lotes"><b>▦</b>Lotes</button><button data-mobile="amenidades"><b>♧</b>Áreas</button><button data-mobile="contact"><b>◌</b>Contato</button></nav>

  lago:{type:'Área comum',title:'Lago e Deck',text:'Um dos pontos de contemplação do Solaris, integrado à vegetação e ao circuito de lazer.',facts:[['Natureza','Integração paisagística'],['Uso','Lazer e convivência']]},
  clube:{type:'Área comum',title:'Clube e Piscinas',text:'Núcleo de convivência do residencial, conectado às quadras e áreas de esporte.',facts:[['Convivência','Clube social'],['Lazer','Piscinas e apoio']]},
  hipica:{type:'Área comum',title:'Centro Hípico',text:'Área equestre inserida no paisagismo do empreendimento, próxima à faixa verde ao sul.',facts:[['Experiência','Equestre'],['Entorno','Vegetação nativa']]},
  portaria:{type:'Acesso',title:'Portaria do Solaris',text:'Chegada principal do empreendimento e conexão com o sistema viário do Bairro Parque das Árvores.',facts:[['Acesso','Controlado'],['Conexão','Eixo principal']]},
  parque:{type:'Bairro planejado',title:'Parque das Árvores',text:'Setor integrado ao Solaris dentro do masterplan urbano, com quadras amplas e conexão ao sistema viário principal.',facts:[['Conceito','Bairro planejado'],['Integração','Uso urbano']]}
};
Object.keys(LOTS).forEach(k=>data[k]={type:'Quadra '+k,title:'Quadra '+k,text:`Quadra residencial do Solaris com ${LOTS[k]} lotes identificados no masterplan. Selecione esta área para aproximar a implantação e avaliar sua posição no empreendimento.`,facts:[['Lotes',String(LOTS[k])],['Setor','Solaris Residencial'] ]});
const scenes=[
  {id:'aerea',label:'Visão Aérea',pos:'center'}, {id:'portaria',label:'Portaria',pos:'90% 52%'}, {id:'lago',label:'Lago e Deck',pos:'15% 47%'}, {id:'clube',label:'Clube e Piscinas',pos:'56% 48%'}, {id:'parque',label:'Bairro Parque',pos:'78% 32%'}, {id:'hipica',label:'Centro Hípico',pos:'50% 78%'}, {id:'C',label:'Ruas e Paisagismo',pos:'46% 69%'}
];
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),drawer=document.getElementById('drawer'),lotbar=document.getElementById('lotbar'),searchbox=document.getElementById('searchbox'),toast=document.getElementById('toast');
let state={x:0,y:0,s:1,tilt:false,drag:false,px:0,py:0,pinch:null};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function render(animate=true){world.style.transition=animate?'transform .55s cubic-bezier(.2,.8,.2,1),filter .35s,box-shadow .35s':'none';const rx=state.tilt?58:0;const rz=state.tilt?-1.5:0;world.style.transform=`translate(calc(-50% + ${state.x}px),calc(-50% + ${state.y}px)) scale(${state.s}) rotateX(${rx}deg) rotateZ(${rz}deg)`;viewport.classList.toggle('mode3d',state.tilt)}
function go(id,open=true){const f=focus[id]||focus.aerea;const r=viewport.getBoundingClientRect();state.s=f.s;state.x=f.x*r.width/100;state.y=f.y*r.height/100;render();document.querySelectorAll('.hotspot').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(open&&data[id])showDrawer(id)}
function showDrawer(id){const d=data[id];if(!d)return;drawer.querySelector('#drawerEyebrow').textContent=d.type;drawer.querySelector('#drawerTitle').textContent=d.title;drawer.querySelector('#drawerText').textContent=d.text;drawer.querySelector('#drawerFacts').innerHTML=d.facts.map(f=>`<div class="fact"><small>${f[0]}</small><b>${f[1]}</b></div>`).join('');drawer.classList.add('open')}
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2100)}
function setMode(mode){document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));lotbar.classList.remove('show');searchbox.classList.remove('show');if(mode==='aerea'){state.tilt=false;go('aerea',false);say('Visão aérea centralizada')}if(mode==='3d'){state.tilt=true;state.s=Math.max(1.12,state.s);render();say('Modo 3D: arraste e aproxime o masterplan')}if(mode==='lotes'){state.tilt=false;render();lotbar.classList.add('show');searchbox.classList.add('show');say('Selecione uma quadra A–J')}if(mode==='amenidades'){state.tilt=false;render();go('clube');say('Áreas comuns em destaque')}if(mode==='infra'){state.tilt=false;go('portaria');openModal('Infraestrutura','A camada de infraestrutura está preparada para receber redes, vias, iluminação e demais informações técnicas do projeto. A interface já permite incorporar esses dados por trecho.')}if(mode==='dist'){openModal('Distâncias e entorno','Esta área foi preparada para conectar tempos de deslocamento e pontos estratégicos do entorno. Os dados podem ser integrados ao mapa sem alterar a experiência visual.')}if(mode==='ar'){startAR()}}
function openModal(title,text){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('modal').classList.add('open')}
async function startAR(){state.tilt=true;render();let msg='No celular, mova o aparelho para criar uma sensação de profundidade sobre a implantação.';try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p==='granted')enableOrientation()}else enableOrientation()}catch(e){}openModal('Realidade aumentada',msg)}
function enableOrientation(){if(enableOrientation.on)return;enableOrientation.on=true;window.addEventListener('deviceorientation',e=>{if(!state.tilt||state.drag)return;const g=clamp((e.gamma||0),-25,25);const b=clamp((e.beta||0)-45,-20,20);world.style.transform=`translate(calc(-50% + ${state.x+g*1.1}px),calc(-50% + ${state.y+b*.8}px)) scale(${state.s}) rotateX(${58-b*.35}deg) rotateZ(${-1.5+g*.08}deg)`})}
Object.keys(LOTS).forEach(k=>{const b=document.createElement('button');b.className='lotchip';b.textContent=`Quadra ${k} · ${LOTS[k]} lotes`;b.onclick=()=>go(k);lotbar.appendChild(b)});
const scenesEl=document.getElementById('scenes');scenes.forEach(s=>{const b=document.createElement('button');b.className='scene'+(s.id==='aerea'?' active':'');b.dataset.id=s.id;b.style.setProperty('--thumb',`url(${IMG})`);b.style.setProperty('--pos',s.pos);b.innerHTML='<div class="thumb"></div><span>'+s.label+'</span>';b.onclick=()=>go(s.id);scenesEl.appendChild(b)});
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();go(b.dataset.id)}));
document.querySelectorAll('.sidebtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('[data-mobile]').forEach(b=>b.onclick=()=>{const m=b.dataset.mobile;if(m==='contact')return contact();setMode(m)});
document.getElementById('zoomIn').onclick=()=>{state.s=clamp(state.s+.2,.75,3.1);render()};document.getElementById('zoomOut').onclick=()=>{state.s=clamp(state.s-.2,.75,3.1);render()};document.getElementById('reset').onclick=()=>{state.tilt=false;go('aerea',false);drawer.classList.remove('open')};document.getElementById('full').onclick=()=>{if(document.documentElement.requestFullscreen){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen?.()}else{say('No iPhone, use “Adicionar à Tela de Início” para tela cheia')}};document.getElementById('closeDrawer').onclick=()=>drawer.classList.remove('open');
function contact(){const txt=encodeURIComponent('Olá! Quero conhecer melhor o Solaris Residencial Resort.');window.open('https://api.whatsapp.com/send?text='+txt,'_blank','noopener')}
document.getElementById('contactBtn').onclick=contact;document.getElementById('drawerCta').onclick=contact;
document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modalPrimary').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});
document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-top]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const id=b.dataset.top;if(id==='masterplan')setMode('aerea');if(id==='galeria')scenesEl.scrollIntoView({behavior:'smooth'});if(id==='amenidades')setMode('amenidades');if(id==='localizacao')openModal('Localização','O módulo de localização está pronto para receber mapa, rotas e pontos estratégicos do entorno do Solaris.');if(id==='videos')openModal('Vídeos','A galeria poderá receber vídeos de obra, sobrevoos de drone e passeios virtuais em 360°.')});
viewport.addEventListener('wheel',e=>{e.preventDefault();state.s=clamp(state.s*(e.deltaY>0?.9:1.1),.72,3.2);render(false)},{passive:false});
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(!isTouch){
  viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.hotspot'))return;state.drag=true;state.px=e.clientX;state.py=e.clientY;viewport.classList.add('dragging');viewport.setPointerCapture?.(e.pointerId)});
  viewport.addEventListener('pointermove',e=>{if(!state.drag)return;state.x+=e.clientX-state.px;state.y+=e.clientY-state.py;state.px=e.clientX;state.py=e.clientY;render(false)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>viewport.addEventListener(ev,()=>{state.drag=false;viewport.classList.remove('dragging')}));
}
let touchMode=null,touchDist=0,touchX=0,touchY=0;
viewport.addEventListener('touchstart',e=>{
  if(e.target.closest('.hotspot,button,input')) return;
  if(e.touches.length===1){touchMode='pan';touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;state.drag=true}
  else if(e.touches.length===2){touchMode='pinch';touchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);state.drag=false}
},{passive:true});
viewport.addEventListener('touchmove',e=>{
  if(touchMode==='pan'&&e.touches.length===1){e.preventDefault();const t=e.touches[0];state.x+=t.clientX-touchX;state.y+=t.clientY-touchY;touchX=t.clientX;touchY=t.clientY;render(false)}
  else if(touchMode==='pinch'&&e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(touchDist>0){state.s=clamp(state.s*(d/touchDist),.72,3.2);touchDist=d;render(false)}}
},{passive:false});
viewport.addEventListener('touchend',e=>{if(e.touches.length===0){touchMode=null;state.drag=false}else if(e.touches.length===1){touchMode='pan';touchX=e.touches[0].clientX;touchY=e.touches[0].clientY}},{passive:true});
viewport.addEventListener('touchcancel',()=>{touchMode=null;state.drag=false},{passive:true});
function syncViewport(){document.documentElement.style.setProperty('--vh',(window.innerHeight*.01)+'px');render(false)}
window.addEventListener('resize',syncViewport,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(syncViewport,180),{passive:true});
syncViewport();
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();const match=Object.keys(data).find(k=>k.toLowerCase()===q)||Object.keys(data).find(k=>data[k].title.toLowerCase().includes(q));if(match)go(match);else say('Não encontrei esta área no masterplan')});
window.addEventListener('keydown',e=>{if(e.key==='+')document.getElementById('zoomIn').click();if(e.key==='-')document.getElementById('zoomOut').click();if(e.key==='Escape'){drawer.classList.remove('open');document.getElementById('modal').classList.remove('open')}});
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
