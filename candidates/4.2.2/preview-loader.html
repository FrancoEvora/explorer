<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Carregando Explorer 4.2.2</title>
  <style>
    html,body{margin:0;min-height:100%;background:#06151f;color:#f6fbff;font-family:system-ui,-apple-system,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:420px}.bar{height:6px;border-radius:99px;background:#ffffff18;overflow:hidden}.bar:after{content:"";display:block;width:35%;height:100%;background:#c7ff19;animation:move 1s infinite}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(390%)}}
  </style>
</head>
<body>
  <main><div class="box"><h1>Explorer 4.2.2</h1><p id="status">Abrindo a candidata validada…</p><div class="bar"></div></div></main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        const response=await fetch('https://qlatvknnzejjljbottxb.supabase.co/functions/v1/explorer-v422-preview',{cache:'no-store'});
        if(!response.ok) throw new Error('Prévia HTTP '+response.status);
        const html=await response.text();
        if(!html.includes('<title>Explorer 4.2.2</title>')) throw new Error('Bundle da candidata inválido');
        document.open();document.write(html);document.close();
      }catch(error){status.textContent='Falha ao abrir a prévia: '+error.message;document.querySelector('.bar')?.remove();}
    })();
  </script>
</body>
</html>
